name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run lint

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build

  validate-counts:
    name: Validate README counts
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_counts.py

  required-files:
    name: Required files check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check required files exist
        run: |
          for f in LICENSE NOTICE CHANGELOG.md SECURITY.md CODE_OF_CONDUCT.md README.md CLAUDE.md \
            package.json package-lock.json .gitignore .npmignore .npmrc \
            tsconfig.json tsconfig.base.json vitest.config.ts eslint.config.mjs \
            .github/CONTRIBUTING.md .github/PULL_REQUEST_TEMPLATE.md .github/CODEOWNERS \
            .github/FUNDING.yml .github/dependabot.yml .github/ISSUE_TEMPLATE/config.yml \
            .github/ISSUE_TEMPLATE/bug_report.md .github/ISSUE_TEMPLATE/feature_request.md \
            .github/workflows/ci.yml .github/workflows/publish.yml \
            kb/procedures/sop-pre-commit.md kb/procedures/sop-release.md \
            kb/procedures/sop-post-release-testing.md kb/reference/architecture.md \
            kb/reference/api.md kb/reference/configuration.md kb/reference/audit.md \
            kb/reference/confluence.md kb/howto/setup.md rules/jira-mcp.md; do
            test -s "$f" || { echo "Missing or empty: $f"; exit 1; }
          done
          # Every published package carries its own licence, notice, readme and build config.
          for p in jira-mcp confluence-mcp; do
            for f in package.json tsconfig.json tsup.config.ts README.md LICENSE NOTICE; do
              test -s "packages/$p/$f" || { echo "Missing or empty: packages/$p/$f"; exit 1; }
            done
          done
          test -s packages/core/package.json || { echo "Missing: packages/core/package.json"; exit 1; }
          test -s packages/jira-mcp/hooks/jira-mcp-hooks.json || { echo "Missing: jira-mcp hooks manifest"; exit 1; }
