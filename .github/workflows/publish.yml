name: Publish

# Tag push only. Every gate (typecheck, lint, tests on macOS and Linux,
# counts, licence banner, pack smoke) runs locally in scripts/release.sh
# before the tag exists; see kb/procedures/sop-release.md. This job builds
# and publishes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write        # GitHub Release
      packages: write
      id-token: write        # required for --provenance (OIDC attestation)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Both packages ship under one version and one tag (ADR-0002).
      - name: Tag equals every package version
        run: |
          for f in package.json packages/jira-mcp/package.json packages/confluence-mcp/package.json; do
            V=$(node -p "require('./$f').version")
            test "$GITHUB_REF_NAME" = "v$V" \
              || { echo "::error::tag $GITHUB_REF_NAME does not match $f $V"; exit 1; }
          done
      - run: npm ci
      - run: npm run build
      - name: Verify npm token
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Publishing them in separate steps means a failure on the second leaves
      # the first already on npm; the release SOP's rollback covers that by
      # deprecating the orphan and re-releasing a patch.
      - name: Publish @softspark/jira-mcp
        run: npm publish --access public --provenance --workspace @softspark/jira-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @softspark/confluence-mcp
        run: npm publish --access public --provenance --workspace @softspark/confluence-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
