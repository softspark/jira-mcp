name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write        # required for --provenance (OIDC attestation)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Verify npm token
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Both packages ship under one version and one tag. Publishing them in
      # separate steps means a failure on the second leaves the first already
      # on npm; the release SOP's rollback covers that by deprecating the
      # orphan and re-releasing a patch.
      - name: Publish @softspark/jira-mcp
        run: npm publish --access public --provenance --workspace @softspark/jira-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @softspark/confluence-mcp
        run: npm publish --access public --provenance --workspace @softspark/confluence-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
